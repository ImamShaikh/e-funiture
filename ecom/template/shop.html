{% extends "base.html" %}
{% load static %}

{% block mainblock %}
		<!-- Start Hero Section -->
		<div class="hero">
			<div class="container">
				<div class="row justify-content-between">
					<div class="col-lg-5">
						<div class="intro-excerpt">
							<h1>Shop</h1>
						</div>
					</div>
					<div class="col-lg-7">

					</div>
				</div>
			</div>
		</div>
	<!-- End Hero Section -->
    <!-- Search Bar -->
		<div style="text-align: center; margin: 20px 0;">
			<form method="POST" action="/search-product" style="display: inline-block; width: 50%;">
				{% csrf_token%}
				<input type="text" required name="search-bar" id="searchBar" placeholder="Search products..." style="width: 70%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px;">
				<button type="submit" style="padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">Search</button>
			</form>
		</div>
	<!-- End Search Bar -->
	
	<div class="untree_co-section product-section before-footer-section">
		<div class="container">
			  <div class="row">
				{% for item in product %}
				  <!-- Start Column 1 -->
				<div class="col-12 col-md-4 col-lg-3 mb-5">
					<a class="product-item" href="/product/{{item.id}}">
						<img src="{{item.image.url}}" class="img-fluid product-thumbnail">
						<h3 class="product-title">{{item.name}}</h3>
						<strong class="product-price">{{item.price}}</strong>

						<span class="icon-cross">
							<img src="{% static 'images/cross.svg' %}" class="img-fluid">
						</span>
					</a>
				</div> 
				{% endfor %}
				<!-- End Column 1 -->
			  </div>
		</div>
	</div>
{% endblock mainblock %}
